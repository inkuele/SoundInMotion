name: Create and Upload Release ZIP with Submodules

on:
  push:
    tags:
      - 'v*'  # e.g. v1.0, v2.1.3, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show submodule status (debug)
        run: git submodule update --init --recursive

      - name: Show submodule contents (debug)
        run: ls -R OddBall/SC  # Replace with your actual submodule path if needed

      - name: Create ZIP with submodules
        run: |
          TAG_NAME=$(echo "${GITHUB_REF##*/}")
          ZIP_NAME="soundinmotion-${TAG_NAME}.zip"
          zip -r "$ZIP_NAME" . -x '*.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release & upload asset
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.BUSCON_SOUNDINMOTION }}

