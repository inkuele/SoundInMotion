name: Create and Upload Release ZIP with Submodules

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo and submodules (with PAT for private access)
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.BUSCON_SOUNDINMOTION }}

      - name: Show submodule contents
        run: ls -R OddBall/SC || echo "Submodule folder not found"

      - name: Create ZIP
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          ZIP_NAME="soundinmotion-${TAG_NAME}.zip"
          zip -r "$ZIP_NAME" . -x '*.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.BUSCON_SOUNDINMOTION }}

