name: Create and Upload Release ZIP (Manual Submodule Clone)

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0, v2.1.3

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Manually clone submodule repo into OddBall/SC
        run: |
          mkdir -p OddBall
          git clone https://github.com/inkuele/oddball.git OddBall/SC

      - name: Verify submodule contents
        run: ls -R OddBall/SC

      - name: Create ZIP including manually cloned submodule
        run: |
          TAG_NAME=$(echo "${GITHUB_REF##*/}")
          ZIP_NAME="soundinmotion-${TAG_NAME}.zip"
          zip -r "$ZIP_NAME" . -x '*.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.BUSCON_SOUNDINMOTION }}

