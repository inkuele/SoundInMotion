name: Create and Upload Release ZIP with Submodules (Auto-Integrated)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo and submodules (using PAT)
        uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.BUSCON_SOUNDINMOTION }}

      - name: Debug: Show submodule contents
        run: ls -R OddBall/SC

      - name: Create ZIP
        run: |
          TAG_NAME=$(echo "${GITHUB_REF##*/}")
          ZIP_NAME="soundinmotion-${TAG_NAME}.zip"
          zip -r "$ZIP_NAME" . -x '*.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.BUSCON_SOUNDINMOTION }}

